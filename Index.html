<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library</title>

  <!-- External Libraries & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="header-bg py-4 mb-4">
    <div class="container">
      <div class="d-flex flex-wrap align-items-end justify-content-between gap-3">
        <div>
          <div class="eyebrow mb-1">Personal Catalogue</div>
          <h1>My Library</h1>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-light btn-sm fw-semibold" id="btnImport"><i class="bi bi-upload me-1"></i>Import JSON</button>
          <input type="file" id="fileImport" accept="application/json,.json" hidden>
          <button class="btn btn-outline-light btn-sm fw-semibold" id="btnExport"><i class="bi bi-download me-1"></i>Export JSON</button>
          <button class="btn btn-light fw-semibold" id="btnNew"><i class="bi bi-plus-lg me-1"></i>Add Book</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <!-- STATS -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat"><div class="number" id="statTotal">0</div><div class="label">Total Books</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat"><div class="number" id="statAvailable">0</div><div class="label">On Shelf</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat"><div class="number" id="statLoaned">0</div><div class="label">On Loan</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat"><div class="number" id="statGenres">0</div><div class="label">Genres</div></div></div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-lg-4">
          <label class="form-label small fw-semibold" for="search">Search</label>
          <input type="search" class="form-control" id="search" placeholder="Title, author, or ISBN">
        </div>
        <div class="col-6 col-lg-3">
          <label class="form-label small fw-semibold" for="filterGenre">Genre</label>
          <select class="form-select" id="filterGenre"><option value="">All</option></select>
        </div>
        <div class="col-6 col-lg-3">
          <label class="form-label small fw-semibold" for="filterStatus">Status</label>
          <select class="form-select" id="filterStatus">
            <option value="">All</option>
            <option value="available">On Shelf</option>
            <option value="loaned">On Loan</option>
          </select>
        </div>
        <div class="col-12 col-lg-2">
          <label class="form-label small fw-semibold" for="sortBy">Sort by</label>
          <select class="form-select" id="sortBy">
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="year">Year</option>
          </select>
        </div>
      </div>
    </div>

    <p class="meta mb-3" id="bookCount"></p>
    <div class="row g-3" id="grid"></div>

    <div class="empty-state d-none" id="emptyState">
      <i class="bi bi-book display-6 d-block mb-2 icon-brass"></i>
      <p class="mb-3" id="emptyText">Your bookshelf is empty.</p>
      <button class="btn btn-gold" id="btnNewEmpty"><i class="bi bi-plus-lg me-1"></i>Add first book</button>
      <button class="btn btn-outline-gold d-none" id="btnClearFilters"><i class="bi bi-x-lg me-1"></i>Clear filters</button>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="bookForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title display-face" id="modalTitle">New book</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="fieldId">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="fieldTitle">Title</label>
                <input class="form-control" id="fieldTitle" required>
                <div class="invalid-feedback">Enter the title of the book.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fieldAuthor">Author</label>
                <input class="form-control" id="fieldAuthor" required>
                <div class="invalid-feedback">Enter the author's name.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fieldGenre">Genre</label>
                <input class="form-control" id="fieldGenre" list="genreOptions" required>
                <datalist id="genreOptions"></datalist>
                <div class="invalid-feedback">Enter a genre, for example Fiction.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="fieldYear">Year</label>
                <input type="number" class="form-control" id="fieldYear" min="0" max="2100" step="1">
                <div class="invalid-feedback">Enter a year between 0 and 2100.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="fieldIsbn">ISBN</label>
                <input class="form-control mono" id="fieldIsbn">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="fieldShelfmark">Shelfmark</label>
                <input class="form-control mono" id="fieldShelfmark" placeholder="e.g. A-12">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fieldStatus">Status</label>
                <select class="form-select" id="fieldStatus">
                  <option value="available">On shelf</option>
                  <option value="loaned">On loan</option>
                </select>
              </div>
              <div class="col-md-6 d-none" id="borrowerWrap">
                <label class="form-label" for="fieldBorrower">Lent to</label>
                <input class="form-control" id="fieldBorrower" placeholder="Name of the borrower">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-link text-secondary text-decoration-none" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gold">Save book</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer mt-auto py-3">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="footer-mark display-face">My Library</span>
      <span class="footer-note">&copy; <span id="footerYear">2026</span> Siro Corriga</span>
    </div>
  </footer>

  <!-- IMPORT MODAL -->
  <div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title display-face">Import books</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3" id="importSummary"></p>
          <div class="d-grid gap-2">
            <button class="btn btn-gold text-start" data-mode="update">
              Update and add
              <span class="d-block small fw-normal opacity-75">Overwrite the books already on the shelf, add the new ones.</span>
            </button>
            <button class="btn btn-outline-gold text-start" data-mode="add">
              Add new only
              <span class="d-block small fw-normal">Leave the current books untouched.</span>
            </button>
            <button class="btn btn-outline-danger text-start" data-mode="replace">
              Replace everything
              <span class="d-block small fw-normal">Discard the current catalogue.</span>
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link text-secondary text-decoration-none" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center border-0 toast-app" id="notificationToast">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- JS LIBRARIES & APPLICATION -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
